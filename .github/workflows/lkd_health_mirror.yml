-- Шаг 6. Контрольные цифры листа 22 «Конвертация бонусов» за апрель–сентябрь 2026 по зеркалам в Litics.
-- Только чтение. Выполнять в DBeaver в Litics. Даты в зеркалах — МСК.
SELECT r.block, r.item, r.period, r.value
FROM (
    -- 1. Конвертировано: подарки по месяцу выдачи и типу из базы ПЛ
    SELECT '1 конвертировано' AS block, x.item, x.period, SUM(x.qty) AS value
    FROM (
        SELECT CASE gi.issuance_type WHEN 1 THEN 'ПЛ' WHEN 2 THEN 'ФА' ELSE CONCAT('тип ', gi.issuance_type) END AS item,
               DATE_FORMAT(gi.created_at, '%Y-%m') AS period,
               gi.gift_quantity AS qty
        FROM litics.pf_loyality_bonus_operation_gift_items gi
        WHERE gi.created_at >= '2026-04-01' AND gi.created_at < '2026-10-01'
    ) x
    GROUP BY x.item, x.period

    UNION ALL

    -- 2. Списано: штуки реестра по месяцу даты списания и типу акции из реестра
    SELECT '2 списано' AS block, y.item, y.period, SUM(y.qty) AS value
    FROM (
        SELECT COALESCE(g.promotion_type, 'без типа') AS item,
               DATE_FORMAT(g.write_off_date, '%Y-%m') AS period,
               g.quantity AS qty
        FROM litics.gs_gifts_registry g
        WHERE g.write_off_date >= '2026-04-01' AND g.write_off_date < '2026-10-01'
    ) y
    GROUP BY y.item, y.period

    UNION ALL

    -- 3. Резерв на 30.09: сумма по клиникам floor(баланс / 3000), баланс = начисления − списания до 01.10.2026 00:00 МСК.
    --    Три варианта отбора клиник; в period — число клиник, у которых резерв не меньше 1 подарка.
    SELECT '3 резерв на 30.09' AS block, w.item,
           CONCAT('клиник ', SUM(CASE WHEN (w.k = 1 OR (w.k = 2 AND s.c_active = 1) OR (w.k = 3 AND s.c_reg = 1))
                                       AND s.gifts > 0 THEN 1 ELSE 0 END)) AS period,
           SUM(CASE WHEN w.k = 1 OR (w.k = 2 AND s.c_active = 1) OR (w.k = 3 AND s.c_reg = 1)
                    THEN s.gifts ELSE 0 END) AS value
    FROM (
        SELECT 1 AS k, 'все клиники с балансом' AS item
        UNION ALL SELECT 2, 'подключенные: активна, есть учетка, не тестовый ИНН'
        UNION ALL SELECT 3, 'подключенные и зарегистрированы до 01.10'
    ) w
    CROSS JOIN (
        SELECT FLOOR(GREATEST(bal.balance, 0) / 3000) AS gifts,
               CASE WHEN c.is_active = 1 AND c.inn NOT LIKE '999999999%' THEN 1 ELSE 0 END AS c_active,
               CASE WHEN c.is_active = 1 AND c.inn NOT LIKE '999999999%'
                         AND c.registered_at < '2026-10-01' THEN 1 ELSE 0 END AS c_reg
        FROM (
            SELECT b.clinic_id,
                   SUM(CASE b.type WHEN 1 THEN b.sum_bonuses WHEN 2 THEN -b.sum_bonuses ELSE 0 END) AS balance
            FROM litics.pf_loyality_bonus_operations b
            WHERE b.created_at < '2026-10-01'
            GROUP BY b.clinic_id
        ) bal
        LEFT JOIN litics.pf_customers_clinics c ON c.id = bal.clinic_id
    ) s
    GROUP BY w.k, w.item

    UNION ALL

    -- 4. Акции ФА: счетчик выданных подарков из базы ПЛ
    SELECT '4 акции ФА' AS block,
           CONCAT(p.id, ' ', COALESCE(p.name, '')) AS item,
           CONCAT(DATE_FORMAT(p.start_date, '%d.%m.%Y'), ' - ', COALESCE(DATE_FORMAT(p.end_date, '%d.%m.%Y'), '')) AS period,
           p.issued_count AS value
    FROM litics.pf_loyality_promotions p
    WHERE p.type = 2
) r
ORDER BY r.block, r.item, r.period;
